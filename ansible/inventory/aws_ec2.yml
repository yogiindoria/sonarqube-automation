
---
plugin: amazon.aws.aws_ec2

regions:
  - ap-south-1

filters:
  instance-state-name: running
  "tag:Name":
    - sonarqube-bastion
    - sonarqube-server

hostnames:
  - instance-id

keyed_groups:
  - key: ec2_tags.Name
    prefix: role
    separator: "_"

compose:
  ansible_host: private_ip_address
